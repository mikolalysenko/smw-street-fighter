name: Native builds
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: make test sanitize test-smw
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: macos-14
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-2022
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Download the prepared release data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p local
          gh release download demo-2026-10-12 --pattern runtime-data.zip --dir local
          python -c "import zipfile; zipfile.ZipFile('local/runtime-data.zip').extractall('local')"
          python -c "import hashlib,json,pathlib; p=pathlib.Path('local'); m=json.loads((p/'SHA256.json').read_text()); assert all(hashlib.sha256((p/k).read_bytes()).hexdigest()==v for k,v in m.items())"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev patchelf
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install sdl2
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            python
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
      - name: Build and package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export LDFLAGS='-Wl,-headerpad_max_install_names'; fi
          make smw test-animations test-audio
          python3 dev/package_native.py --version 0.6.0
          python3 dev/smoke_package.py dist/releases/super-mario-world-ii-${{ matrix.name }}
      - name: Build and package Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make smw SDLFLAGS="$(sdl2-config --libs) -lm"
          python dev/package_native.py --version 0.6.0
          python dev/smoke_package.py dist/releases/super-mario-world-ii-windows-x86_64
      - name: Upload complete player package
        uses: actions/upload-artifact@v4
        with:
          name: super-mario-world-ii-${{ matrix.name }}
          path: |
            dist/releases/*.zip
            dist/releases/*.tar.gz
          if-no-files-found: error
