name: Native builds
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: make test sanitize test-smw
      - uses: actions/upload-artifact@v4
        with:
          name: linux-executable-without-game-data
          path: |
            build/smw/smw
